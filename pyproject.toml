[project]
name = "datadoc-cli"
version = "0.3.0"
description = "The Open Source Operating System for Dataset Engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "narain-karti" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "plotext>=5.2.8",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/narain-karti/DATADOC"
Repository = "https://github.com/narain-karti/DATADOC"
Issues = "https://github.com/narain-karti/DATADOC/issues"

[project.scripts]
datadoc = "datadoc.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["datadoc"]

