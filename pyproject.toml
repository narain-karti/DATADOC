[project]
name = "datadoc"
version = "0.1.0"
description = "The Open Source Operating System for Dataset Engineering."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
]

[project.scripts]
datadoc = "datadoc.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
