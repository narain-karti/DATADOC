[project]
name = "datadoc-cli"
version = "0.6.1"
description = "Leakage-safe, local-first preparation pipelines for tabular machine learning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "narain-karti" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "polars>=0.20.0",
    "plotext>=5.2.8",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
ai = [
    "litellm>=1.40.0",
]
ml = [
    "scikit-learn>=1.7.2",
]
ui = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.20",
]
dev = [
    "build>=1.2.0",
    "hatchling>=1.25.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "scikit-learn>=1.7.2",
]
all = [
    "scikit-learn>=1.7.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.20",
    "litellm>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/narain-karti/DATADOC"
Repository = "https://github.com/narain-karti/DATADOC"
Issues = "https://github.com/narain-karti/DATADOC/issues"

[project.scripts]
datadoc = "datadoc.cli.app:app"

[project.entry-points."datadoc.plugins"]
duplicate = "datadoc.plugins.duplicates:DuplicateRemoverPlugin"
missing = "datadoc.plugins.missing_values:MissingValuePlugin"
outlier = "datadoc.plugins.outliers:OutlierPlugin"
datetime = "datadoc.plugins.datetime_feat:DatetimePlugin"
encoder = "datadoc.plugins.encoders:CategoricalEncoderPlugin"
target_encoder = "datadoc.plugins.target_encoder:TargetEncoderPlugin"
rare = "datadoc.plugins.rare:RareCategoryPlugin"
polynomial = "datadoc.plugins.polynomial:PolynomialFeaturesPlugin"
scaling = "datadoc.plugins.scaling:ScalingPlugin"

[tool.datadoc]
task = "auto"
drop_identifiers = false
deduplicate = false
scaling = "auto"
clip_outliers = false
categorical_threshold = 20
rare_category_min_frequency = 0.0
datetime_cyclical = false
datetime_extract_hour = true
strict_schema = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.3"
packages = ["datadoc"]

# Ship the built dashboard so `datadoc ui` works from a plain pip install.
# Requires `web/dist` to exist at build time (see RELEASE_CHECKLIST.md).
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "datadoc/_webui"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"
include = [
    "datadoc/**/*",
    "README.md",
    "LICENSE",
    "MIGRATION.md",
    "CHANGELOG.md",
    "RELEASE_CHECKLIST.md",
    "pyproject.toml",
]

# web/dist is gitignored, so it needs force-include (not just include)
# to survive into the sdist; the wheel is then built from the sdist.
[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"
