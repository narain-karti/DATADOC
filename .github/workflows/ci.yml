name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Setup web dist placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Install deps
        run: uv pip install --system -e ".[dev,ml,ui]"
      - name: Ruff check
        run: ruff check datadoc/
      - name: Ruff format check
        run: ruff format --check datadoc/
      - name: Pytest
        run: pytest tests/ -v --tb=short
      - name: CLI smoke
        run: |
          datadoc --help
          datadoc profile --help
          datadoc plugins list
